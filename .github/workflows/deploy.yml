name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  # ─── Deploy Frontend to Netlify ───────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Netlify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: false

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        run: netlify deploy --prod --dir=build --message="GitHub Actions deploy"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # ─── Deploy Backend to Render ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render Deploy
        id: trigger
        run: |
          echo "Triggering Render deployment..."
          RESPONSE=$(curl -s -o /tmp/render_response.json -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")

          echo "HTTP status: $RESPONSE"
          cat /tmp/render_response.json

          if [ "$RESPONSE" -lt 200 ] || [ "$RESPONSE" -ge 300 ]; then
            echo "❌ Render deploy hook failed with HTTP $RESPONSE"
            exit 1
          fi

          # Extract deploy ID from response
          DEPLOY_ID=$(cat /tmp/render_response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          echo "Deploy ID: $DEPLOY_ID"
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "✅ Render deploy triggered successfully"

      - name: Wait for Render Deploy to Complete
        if: steps.trigger.outputs.deploy_id != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "⚠️  RENDER_API_KEY secret not set — cannot poll deploy status."
            echo "    Add RENDER_API_KEY to GitHub secrets for accurate deploy status."
            exit 0
          fi

          echo "Polling Render deploy status for deploy: $DEPLOY_ID"
          MAX_WAIT=900   # 15 minutes
          POLL_INTERVAL=20
          ELAPSED=0

          # Terminal statuses
          SUCCESS_STATUS="live"
          FAILURE_STATUSES="build_failed update_failed canceled pre_deploy_failed deactivated"

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/deploys/$DEPLOY_ID")

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" != "200" ]; then
              echo "⚠️  Render API returned HTTP $HTTP_CODE — skipping status check"
              exit 0
            fi

            STATUS=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "unknown")
            echo "  [${ELAPSED}s] Deploy status: $STATUS"

            if [ "$STATUS" = "$SUCCESS_STATUS" ]; then
              echo "✅ Render deployment succeeded (status: $STATUS)"
              exit 0
            fi

            for FAIL in $FAILURE_STATUSES; do
              if [ "$STATUS" = "$FAIL" ]; then
                echo "❌ Render deployment FAILED (status: $STATUS)"
                echo ""
                echo "Check Render dashboard for logs: https://dashboard.render.com"
                exit 1
              fi
            done

            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          echo "⏱️  Timed out waiting for Render deploy after ${MAX_WAIT}s"
          echo "   The deployment may still be in progress — check the Render dashboard."
          exit 1

      - name: Render Deploy Status (no deploy ID)
        if: steps.trigger.outputs.deploy_id == ''
        run: |
          echo "⚠️  Could not extract deploy ID from Render hook response."
          echo "    Deploy was triggered but status cannot be verified."
          echo "    Check Render dashboard: https://dashboard.render.com"
